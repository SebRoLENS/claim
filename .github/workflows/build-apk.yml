name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claimboard-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_BUNDLE_B64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct base source
        shell: bash
        run: |
          cat .ci/source.b64.* > source.b64
          base64 -d source.b64 > ClaimBoard-Scanner-base-source.zip
          unzip -t ClaimBoard-Scanner-base-source.zip
          mkdir project
          unzip -q ClaimBoard-Scanner-base-source.zip -d project
          chmod +x project/build.sh project/verify.sh

      - name: Apply current source patches
        shell: bash
        run: |
          cd project
          patch -p0 < ../patches/claimboard-0.3.1.patch
          sed -i 's/android:versionCode="3"/android:versionCode="4"/' AndroidManifest.xml
          sed -i 's/android:versionName="0.3.0"/android:versionName="0.3.1"/' AndroidManifest.xml
          sed -i 's/"appVersion", "0.3.0"/"appVersion", "0.3.1"/' src/it/claimboard/scanner/ClaimDataStore.java
          sed -i 's/Versione 0.3.0 · scansione automatica/Versione 0.3.1 · scansione automatica/' src/it/claimboard/scanner/MainActivity.java
          sed -i 's/ClaimBoard-Scanner-0.3.0-aligned-unsigned.apk/ClaimBoard-Scanner-0.3.1-aligned-unsigned.apk/g' build.sh
          sed -i 's/ClaimBoard-Scanner-0.3.0.apk/ClaimBoard-Scanner-0.3.1.apk/g' build.sh

      - name: Detect compiled version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' project/AndroidManifest.xml | head -n1)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Compiling ClaimBoard Scanner $VERSION"

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Patch D8 input for current Build Tools
        shell: bash
        run: |
          python3 - <<'PY'
          p = 'project/build.sh'
          s = open(p, encoding='utf-8').read()
          old = '"$d8" --min-api 23 --output "$build_dir/dex" "$build_dir/classes"'
          new = '"$d8" --min-api 23 --output "$build_dir/dex" $(find "$build_dir/classes" -type f -name \'*.class\')'
          if old not in s:
              raise SystemExit('Expected D8 command not found')
          open(p, 'w', encoding='utf-8').write(s.replace(old, new))
          PY

      - name: Build aligned unsigned APK
        working-directory: project
        run: ./build.sh

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: claimboard-${{ env.VERSION }}-unsigned
          path: project/build/outputs/ClaimBoard-Scanner-${{ env.VERSION }}-aligned-unsigned.apk
          if-no-files-found: error

      - name: Sign release APK
        if: env.SIGNING_BUNDLE_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="project/build/release-signing"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$SIGNING_BUNDLE_B64" | base64 --decode > "$SIGN_DIR/signing-backup.zip"
          unzip -q "$SIGN_DIR/signing-backup.zip" -d "$SIGN_DIR"

          README_FILE="$SIGN_DIR/README-signing.txt"
          KEYSTORE_FILE="$SIGN_DIR/claimboard-calibration.keystore"
          KEY_ALIAS=$(sed -n 's/^Alias:[[:space:]]*//p' "$README_FILE" | head -n1)
          KEY_PASSWORD=$(sed -n 's/^Password archivio\/chiave:[[:space:]]*//p' "$README_FILE" | head -n1)

          test -s "$KEYSTORE_FILE"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEY_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "ClaimBoard-Scanner-${VERSION}.apk" \
            "project/build/outputs/ClaimBoard-Scanner-${VERSION}-aligned-unsigned.apk"

          VERIFY_OUT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "ClaimBoard-Scanner-${VERSION}.apk")
          printf '%s\n' "$VERIFY_OUT"
          CERT_SHA256=$(printf '%s\n' "$VERIFY_OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          test "$CERT_SHA256" = "428b8e0a6dfb9e5e93c67b57cc740e5d6ede7ba81b9b880a7fda6347832f9aa2"

          cp "ClaimBoard-Scanner-${VERSION}.apk" ClaimBoard-Scanner-latest.apk
          sha256sum "ClaimBoard-Scanner-${VERSION}.apk" > "ClaimBoard-Scanner-${VERSION}.apk.sha256"

      - name: Upload signed build artifact
        if: env.SIGNING_BUNDLE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: claimboard-${{ env.VERSION }}-signed
          path: |
            ClaimBoard-Scanner-${{ env.VERSION }}.apk
            ClaimBoard-Scanner-latest.apk
            ClaimBoard-Scanner-${{ env.VERSION }}.apk.sha256
          if-no-files-found: error

      - name: Publish signed GitHub Release
        if: github.ref == 'refs/heads/main' && env.SIGNING_BUNDLE_B64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "ClaimBoard-Scanner-${VERSION}.apk" \
              ClaimBoard-Scanner-latest.apk \
              "ClaimBoard-Scanner-${VERSION}.apk.sha256" --clobber
            gh release edit "$TAG" --latest --title "ClaimBoard Scanner ${VERSION}"
          else
            gh release create "$TAG" \
              "ClaimBoard-Scanner-${VERSION}.apk" \
              ClaimBoard-Scanner-latest.apk \
              "ClaimBoard-Scanner-${VERSION}.apk.sha256" \
              --title "ClaimBoard Scanner ${VERSION}" \
              --notes "Signed ClaimBoard Scanner ${VERSION} release." \
              --latest
          fi

      - name: Sync README version badge
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          version = os.environ['VERSION']
          data = {
              'schemaVersion': 1,
              'label': 'current version',
              'message': version,
              'color': 'blue'
          }
          with open('version-badge.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, separators=(',', ':'))
              f.write('\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version-badge.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync current version ${VERSION}"
            git push origin HEAD:main
          fi
